name: Build & Release Launcher v3

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: # возможность ручного запуска кнопкой в GitHub UI

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE (PyInstaller)
        shell: cmd
        run: |
          call scripts\build_exe.cmd

      - name: Build Installer (Inno Setup)
        shell: pwsh
        run: |
          # На windows-latest Inno Setup можно вызвать через choco или встроенный ISCC
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
              choco install innosetup --no-progress
              echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\launcher_setup.iss

      - name: Package Lightweight Update ZIP (app + scripts + version.json)
        shell: pwsh
        run: |
          $rawTag = "${{ github.ref_name }}"
          $ver = if ($rawTag.StartsWith("v")) { $rawTag.Substring(1) } else { "3.1.0" }
          $zipName = "launcher-update-$ver.zip"

          # Архивируем только обновляемые файлы (без тяжёлого рантайма)
          Compress-Archive -Path app, scripts, version.json -DestinationPath $zipName -Force

          # Хэш SHA-256 для проверки целостности
          $hash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLower()
          Write-Host "Generated Update ZIP: $zipName (SHA256: $hash)"

          # Сохраняем переменные для шага релиза
          echo "UPDATE_ZIP=$zipName" >> $env:GITHUB_ENV
          echo "UPDATE_HASH=$hash" >> $env:GITHUB_ENV
          echo "APP_VER=$ver" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "F-Engineering Launcher v${{ env.APP_VER }}"
          files: |
            ${{ env.UPDATE_ZIP }}
            dist_setup/FEngineering_Launcher_v3_Setup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
